   `hs-game-sdk/curated/` and the `ForgePact/docs/*-research.md` docs
   (`section.py <doc> --grep <name>`) for every script and object the
   procedure relies on, and cite what you found in its **relies on** field
   below. A reading that establishes a game fact is folded into
   `docs/RUNTIME_DATA_MODELS.md` in the same feature, labelled as a static
   reading (`AGENTS.md` § "Fold What a Mod Learned About the Game Into the
   Shared References"). In ForgePact #160 (2026-10-04) the readings were not
   in the shared references yet, and Live 1 was planned around a script that
   White Mage casts never reach.

## What a usable acceptance criterion looks like

This decides whether the pipeline works: the verifier runs cheap and executes
what you write; it cannot interpret intent. Every criterion is a **command
with an expected result**, or a **file that must exist or have changed** —
never a description of correct behaviour.

```
## Acceptance criteria

- [ ] (reads `hs-game-sdk/python/**`, `tests/test_relic_identification.py`)
      `py -3 -m unittest tests.test_relic_identification` exits 0
- [ ] `tests/test_relic_identification.py` asserts a VALUE_REF player scans
      identically to a VALUE_OBJECT one
- [ ] `docs/submodules/ForgePact/instructions.md` records the new command
```

Not: "the relic scanner handles both value kinds correctly" — nobody runs that.

A conditional criterion or step names the **gate token in `## State`** (e.g.
`phase0: complete`), never "once `## Log` shows X".

**If a criterion cannot be made mechanical, say so** under `## Needs human
judgement` rather than dressing it up as a checkbox. The verifier routes
those to a human instead of guessing.

## Baseline and target, as tests

`AGENTS.md` § "Mod Development Workflow" requires both ends of a behaviour
change as tests before it is written: a **baseline** test pinning current
behaviour (a toggle off by default still reproduces it), and a **target** test
the change is meant to turn green. Prefer a fixture on `hs-game-sdk` structs
over a live game session for both; reserve an in-game run for final
confirmation, and say so rather than leaving the implementer to find the loop
is expensive.

## A live session is a procedure, not a request

When a criterion needs the running game, write the session as a
`### Live procedure <n>` subsection of the context file, because `live-operator`
— a fresh agent that has read nothing else — runs it:

- **build**: which DLL the session needs (the owner is asked before it is
  installed; never write an install step);
- **character**: the save slot to load;
- **control**: one command already known to produce output on this build, and
  what that output looks like — without one the session proves nothing;
- **steps**: each a command (`hs_command` lines), a screenshot, or one
  action a person takes, with the **expected** result beside it;
- **cases**: one or two ordinary cases plus the outliers that take a different
  code path — not every skill or item (`AGENTS.md` § "Mod Development
  Workflow");
- **relies on**: each script or object the checks depend on, with where it is
  documented (a `docs/RUNTIME_DATA_MODELS.md` section, a curated file, a
  research doc heading), or "not found in the shared references or research
  docs". A session built on an unchecked script can measure a path the game
  never takes: ForgePact #160's Live 1 (2026-10-04) did.

The session criterion reads the capture with the tool, never a hand-written
grep: `py -3 tools/live_checks.py .claude/workorders/<slug>-live-<n>.md
--expect <every check name, comma-separated> --require-pass <checks>` exits
0, gated on the session's gate token. What goes on `--require-pass` depends on
what a `fail` would mean:

- **session-validity checks** — `dll-hash`, `marker`, `control` — always:
  failing one means nothing was measured;
- **acceptance checks of shipped behaviour** (a build's `on-*`, `off-*`,
  `no-duplicate`): the feature is wrong if one fails, so it must pass;
- **research checks** — the question the session exists to answer — never.
  Their `fail` or `not-observed` is the finding, routed by the driver
  (SKILL.md Step 4.5), and a criterion that demands `pass` turns a result
  into a defect round: forgepact-issue-14-phase1b round 2 capped that way.

Nine forgepact-issue-14 plans instead grepped for `| (pass|fail|not-observed)$`
and counted lines. The operator's note after a verdict and one renamed check
cost three rounds and a split workorder on punctuation.

**A follow-up measurement on the same build is a second session of this
workorder, not a new phase.** When the question a session raises can be
answered with the DLL already installed, write it as `### Live procedure
<n+1>` in this context file, with its own capture `<slug>-live-<n+1>.md` and
its own criterion. Every session restores its own backup at teardown, so
write its starting values against the state before the previous session, not
the state that session left. Twice in forgepact-issue-14 such a
follow-up (1c→1d, 1e→1f) became a whole new workorder that started 65 and 80
minutes after the session before it.

## Specify behaviour, not text

A step says what must be true and where; the criteria prove it. Embed literal
code or prose only when the exact bytes are themselves the requirement (a
string a test pins) — never as a sketch of how to write the step. A plan that
carries the implementation makes every review finding a defect in the plan,
not the code — measured at two replans, 12.9M tokens and 45 minutes in one
workorder — and reduces the implementer to a typist instead of someone who can
adapt to what they actually find.

## After a write, read the diff, not the file

An `Edit` that returned success landed. Do not read a plan or context file
back after editing it: check the one section with `section.py <file>
'<heading>'`, the outline with `grep -n '^## \\|^### ' <file>`, and the plan's
shape with `py -3 tools/plan_lint.py <plan>`. The owner, 2026-10-02: after
each write, read only the difference or the relevant part. A replan or an
amendment reads the code its defect names the same way, by `git diff <base>
-- <path>` and the ranges around its hunks. `tools/workorder_audit.py` R26
fails a planner that reads a file it wrote whole more than twice.

## Pre-flight, before `verdict: PLAN-READY`

Confirm every path, symbol, script/object name, command and expected output
the plan names against the working tree, in this run — grep, ls, or run it.
Mark anything unconfirmed `UNVERIFIED:` in place, or move it to `## Needs
human judgement`. Never state it as fact.

Cite every Context subsection a step needs as `ctx: "<heading>"`, with the
heading exactly as written. The implementer starts from `py -3
tools/workorder_brief.py`, which prints the Context subsections the selected
steps and criteria cite and nothing else, so a step that leans on Context it
does not cite sends its implementer back to the whole file. A citation the
brief cannot resolve prints `ctx not found: "<cite>"` in that brief.

Then run `py -3 tools/plan_lint.py .claude/workorders/<slug>-plan.md` and fix
every finding before returning: a criterion in prose, a heading slice not
anchored on `\\n` (`t.index('\\n## X\\n')`, since a heading's name is often
mentioned in backticks above the heading itself), a grep over a live capture
instead of `live_checks.py`, `python` where this repository runs `py -3`, or
a bare commit hash (see "Spend each check once" below). Each has cost a round.
It also fails a plan that researches a game mechanism with no `ghidra mcp:`
State line, as `ghidra-unchecked`, and a value other than `used`,
`unavailable` or `skipped — <reason>`, as `ghidra-bad-value` ("Before you
plan anything" item 4).
Its `no-reads` and `reads-nothing` warnings do not fail the lint, but clear
them too. Every criterion without a reach map is re-run on every fix round.

## Spend each check once

A full verify is the expensive part of a round: for the ForgePact panel,
25-35 minutes (the Python suite 11-17, the oracle replay and its negative
control about 8, six e2e suites about 6, `e2e:perf` about 8), paid at least 15
times across the UI redesign's 14 workorders. Plan so it is paid as rarely as
the work allows (SKILL.md "Spend each check once, and overlap what does not
wait"; evidence in `docs/agents/workorder-calibration.md`).

- **Fewer, larger workorders, as items.** Prefer one workorder whose parts
  are `### Item:` groups (see "Items" below) over a chain of small sequential
  workorders, each paying its own full verify. Each item is implemented,
  checked and committed on its own the moment its files are free, and the
  whole-tree criteria run once at the end. "The suites must run after the
  edits" is not a reason to decline items: that is what the final gate is,
  and every planner in the redesign declined lanes on that ground. Split
  only for the reason SKILL.md Step 0.5 gives, and remember an item has its
  own budget, so one stubborn item no longer stops the others.
- **Say what each criterion needs to run beside the others.** The verifier
  runs `run_criteria.py --jobs auto`, which puts builds first and runs the
  browser suites, the Python suite and the file checks side by side. It
  recognises the usual commands; mark the rest `(class build)`, `(class
  suite)`, `(class browser)`, `(class test)`, `(class pure)` or `(class
  exclusive)`, and write `(after 3)` on a criterion that reads what
  criterion 3's command writes. An unmarked command it does not recognise
  runs alone in its place in the plan, which is safe and slow.
- **Whole suites run once, before the pull request.** The owner,
  2026-10-02: "full suite runs shouldnt be run so frequently. it should be
  reserved to the last step before the pr. during development only relevant
  subset should be run." Every verify during development is scoped: a first
  verify and the items gate run `run_criteria.py --dev`, a fix round runs by
  reach, and both defer each criterion whose every command is a whole suite
  (`unittest discover`, `run_tests_parallel.py`, a bare `pytest`) and each
  one you mark `(final)` (a perf benchmark, an oracle replay, anything slow
  that only the finished change needs). So give every module the change
  touches its own **targeted** criterion beside the whole suite: `py -3 -m
  unittest tests.test_<x>` for the test modules that cover it, the module's
  `npm test`, the e2e suite for the screen it touched. Without one,
  development verifies nothing for that module, and a regression first shows
  at the final gate, the most expensive place to find it.
- **Tier the verification.** A middle workorder, one whose output another
  workorder in the same feature will build on and verify again, puts in its
  criteria only what its change can reach: the module's `npm test`, the e2e
  suite for the screen it touched, the Python tests of the module it changed
  (`py -3 -m unittest tests.test_<x>`), the design checks for what it
  restyled. The full set (the whole Python suite, every e2e suite, perf, the
  oracle replay) runs at a join and in the feature's final or ship
  workorder. Say in `## Context` which workorder carries the full set, so a
  reviewer does not read the narrower criteria as a gap.
- **Say what each criterion reads.** Put `(reads `<glob>`, ...)` on every
  criterion: the files whose change could alter its result, from the
  checkout root, with submodule files under their directory. For example,
  `(reads `ForgePact/panel/src/**`, `ForgePact/panel/package.json`)` goes on
  the panel's `npm test`, and `(reads `docs/submodules/ForgePact/instructions.md`)`
  on a docs check. A fix round after a verify that passed everything else
  then re-runs only the criteria the fix reaches, plus the failed ones
  (`run_criteria.py --changed-since`, SKILL.md Step 4 "Re-verify what the
  fix reaches"). A criterion without the declaration runs on every fix
  round, which is safe and slow. `plan_lint.py` warns `no-reads` and prints
  the paths its commands mention. Treat those as a start, not the answer,
  because a whole suite reads far more than its command line names. It also
  warns `reads-nothing` for a glob that matches no tracked file. Declare
  what a suite really covers, and use `(reads `**`)` for one that reads
  everything. If the change has a contract that several criteria depend on
  without naming it, list it on `## State`'s `shared contract:` line: any
  change to it runs the full set.
- **Run each suite once per verify.** ForgePact's Python suite re-runs the
  panel's browser suites: `test_panel_oracle_replay`, `test_panel_e2e*` and
  `test_panel_perf` each run one `npm run` suite. So when a plan's criteria
  run those suites themselves (`npm run oracle:replay`, `npm run e2e`,
  `e2e:gems`, `e2e:perf` and the rest), its full-Python-suite criterion
  leaves those modules out, and the verify checks each suite once:
  `cd ForgePact && py -3 tools/run_tests_parallel.py --exclude-module
  "test_panel_e2e*" --exclude-module test_panel_oracle_replay
  --exclude-module test_panel_perf`. Exclude only a module whose suite
  another criterion of the same plan runs; the id-set check then expects
  discovery less those modules, and a name that matches nothing is refused.
  A plan that runs none of the browser suites directly keeps the whole
  Python suite. Release CI (`forgepact-release.yml`) runs the same split in two parallel jobs (`build` with `--skip-group panel-browser`, `panel-browser-tests` with `--only-group panel-browser`) and covers everything except `test_panel_perf`, which it leaves to the pre-release local run.
  The owner, 2026-09-26: *"If some checks can be done once for 2 things
  it's better than checking twice after each change"*.
- **Never pin a moving head.** A criterion names a commit through a
  per-workorder tag a precondition step creates (`git tag <slug>-base`, e.g.
  `forgepact-ui-polish-base`), or through a merge-base expression
  (`$(git merge-base HEAD origin/main)`), never through a hash copied from
  `HEAD`, `origin/main` or the branch at planning time. That applies to a
  fixed commit too, such as the main commit a merge brings in: tag it, so a
  re-merge moves one tag instead of editing ten criteria. `plan_lint.py`
  flags a bare hash as `pinned-sha`. About ten of the redesign's amendments
  came from pinned hashes and from the two defects below.
- **Backtick only what should run.** `tools/run_criteria.py` runs every
  backticked span whose first word is a command (`git`, `grep`, `py`,
  `npm`, ...), so prose such as "the `git log` shows the merge" is executed
  as written. Put expected output and descriptions outside backticks, or
  phrase them so they do not start with a command word.
- **Slice to the end of the file safely.** A heading slice that looks for the
  next heading (`t.index('\\n## ', start)`) raises when its section is the
  last in the file. Use `find` and fall back to the end: `e = t.find('\\n## ',
  s + 1); e = len(t) if e < 0 else e`. `plan_lint.py` flags it as
  `eof-slice`, even for a section that is not last today.
- **Walk the branch's own commits.** In a plan that merges `origin/main`, a
  `git log A..HEAD` or `git rev-list A..HEAD` also walks main's merged-in
  commits, so a count or a message grep over it is wrong the moment the
  merge lands. Add `--first-parent`, or write `(all-parents)` on a
  criterion that means them. `plan_lint.py` flags it as `merge-walk`.
- **Plan when the inputs exist.** A plan written against the output of a
  workorder that has not finished is written against a guess. Write it as
  `status: DRAFT` with a `depends on: <slug>, ...` line in the header, give
  the driver its outline, and stop. `plan_lint.py` refuses a DRAFT
  (`plan-draft`), so no round starts from it. When the dependencies pass, it
  is re-planned against what they produced and set `READY`. Never edit a
  sibling workorder's plan from yours: say what it should change in your
  report. In the redesign, the restyle and ship plans were rewritten nine
  times between them before either ran a round, and the port and prep
  planners edited plans that were not theirs.
- **Design review comes first in a UI chain.** When the feature is a
  redesign or a new screen, put the design checks where they are cheap
  (SKILL.md rule 9). Run the impeccable detector and a critique on the
  direction comps before any font or asset is bundled. Run the finish
  reviewer after the first restyle round. Give the export workorder a
  structure check of its export against the current panel's page (texts,
  selectors, no runtime values). Phrase a design fix's check over its whole
  class, not only the listed instances.
- **Main moved: merge, stop only when it bites.** Write the precondition as:
  if `origin/main` has commits `HEAD` lacks, merge it when `git merge-tree
  --write-tree HEAD origin/main` exits 0 (no conflict) and `git diff
  --name-only HEAD...origin/main` names none of this plan's files, and record
  the merge in `## Log`; stop with `BLOCKED: main moved` only otherwise. Never
  "if main moved, stop": a main-merge workorder of its own cost 1-2.5 hours
  each time in the redesign.
- **A flaky test is a step, not a retry.** If a suite the plan runs is known
  to fail intermittently, or a failure without a code cause appears during
  your research, add a step that makes it deterministic (a fixed safe port,
  an awaited condition instead of a sleep), in this workorder. A verifier
  that meets one routes it as a defect; nobody re-runs the suite hoping for a
  green.

**Planning while the previous phase is recorded.** The driver may start you
while the last session's record round is still running (SKILL.md Step 4.5).
Read that session's results from its capture (`<slug>-live-<n>.md`), not
from the research doc, which is being written. Cite them as `UNVERIFIED:
being recorded`, and write no step that edits the section the record is
writing.

## The workorder format

Two files. The driver skill and both later phases parse them by section.

`.claude/workorders/<slug>-plan.md`:

```markdown
# <short title>

status: READY        (`DRAFT` while it waits on another workorder's result)
depends on: <slug>, ...        (only on a DRAFT; the workorders it waits on)
round: 0
module: <submodule directory, or "hub">
verdict: PLAN-READY

## State
round: 0        phase: plan
planning: complete        (`streaming` while items are still being released)
gates: none
gates pending: `build: complete`; `live1: complete`
round base: <none yet>
agents: planner-tier=planner        (the agent type you were spawned as: planner, planner-xhigh, planner-max)
reviewers: <none yet>
open defects: none
decisions in force: none
shared contract: none   (or backticked globs whose change runs every criterion)
ghidra mcp: used — <what it answered>   (or `unavailable — <what status printed>; offered setup`, or `skipped — <reason>`)

## Goal
One paragraph. What changes for a user of this toolkit.

## Out of scope
The adjacent things a reasonable implementer would otherwise widen into.
Be specific; this is your main lever against scope drift.

## Acceptance criteria
Mechanical checkboxes, per the section above. A conditional one names its
gate token exactly as `gates pending:` spells it, e.g. "(gate `live1: complete`)".
Each one declares what it reads, e.g. "(reads `ForgePact/panel/src/**`)".

## Steps
Preconditions common to every step (branch, CRLF, do-not-revert) as
imperatives, first. Then the ordered steps; a step that depends on context
names the subsection: `ctx: "<### heading>"`. Every path is relative to this
checkout's root — never an absolute path into another checkout's copy of a
submodule. Optionally, after the preconditions, lanes (see "Lanes" below):

### Lane: <name>
files: `<path>`, `<glob>`, ...
The steps this lane's implementer carries out, alone, inside those files.

### Lane: <other-name>
files: `<path>`, ...
...

### Join
The build, the full suite, and every step that reads another lane's output.
```

Or, instead of lanes, items (see "Items" below):

```markdown
### Item: <id> — <title>
files: `<path>`, `<glob>`, ...
checks:
- `<the fast command this change can reach>` exits 0
- `<another>` prints `<expected>`
after: `<id>`            (optional: items that must be done first)
shares: `<id>`           (optional: an item whose files overlap this one's)
owner: <question>        (optional: the item waits for the owner's answer)
default: <what to do unanswered, or none>   (required beside owner:)
reversible: yes|no — <how to undo the default> (required beside owner:)

1. The steps this item's implementer carries out, numbered.
```

`.claude/workorders/<slug>-context.md`:

```markdown
## Context the implementer needs
Cite, don't copy: a rule from AGENTS.md or the guide is a heading citation,
not a paste — both already live in the repo. Write down only what is not
written down elsewhere: findings, the mechanism, a negative result you
confirmed, a rejected alternative and why. Stable `###` subsections, each
named so a step's `ctx:` can cite it. Target ≤ ~10KB; larger usually means
this is two workorders.

## Needs human judgement
Anything that cannot be a checkbox. Omit the heading if there is nothing.
One `###` subsection per question, each ending:

default: <what the pipeline does if nobody answers, or none>
reversible: yes|no. <how to undo the default>

## Log
### Decisions
Every consultant answer, human decision and escalation note, verbatim.

### Plan
planner: initial plan.
```

**`gates:` is a statement, not a template.** It lists only the gates that are
set now, each as one backticked `name: value` token separated by `; `, or
`none`. A new plan sets none, so its line is `gates: none`. Every gate a
criterion or step may later need goes on `gates pending:`. Research
outcome tokens, which name one of several possible results, go on
`route tokens:` (for example
``route tokens: `save-route: proven` or `save-route: not-observed` ``). Never
write alternatives on `gates:`, whether as `|`, "or", or `<placeholder>`. The
driver moves a token from `gates pending:` to `gates:` when that gate is met.
The verifier and `workorder-rounds.js` read `gates:` literally, and treat a
line with a `|` as no gate set. On 2026-09-24, forgepact-issue-14-phase1j's
`gates:` listed every gate and every possible value, joined with `|`. The
verifier read that as all gates set and ran the live-session criteria before
the session. It reported them as `IMPL-DEFECT` in rounds 0 to 2, and the launch
ended at `CAP` with no real defect open after round 0.

**Lanes: step groups that can run at the same time.** Declare lanes when two
or more groups of steps have disjoint file sets and no data dependency on
each other, and each is big enough to be worth its own implementer. There is
no fixed maximum; the Workflow tool runs at most min(16, CPUs−2) agents at
once and queues the rest. Each lane is a level-3 `### Lane: <name>` heading
directly under `## Steps` (name in `[a-z0-9-]+`, never `join`), whose first
line is `files:` followed by the backticked paths it may edit, relative to
the checkout root; a glob (`*`, `**`, `?`) is allowed. One `### Join`
follows them and needs no `files:`: it runs alone after every lane returned
`IMPL-DONE`, commits each lane's file set as its own commit, and then does
its own steps. Steps written above the first `### Lane:` are preconditions
every lane and the join follow.

A lane step may never contain a full build, the full test suite, or a
commit. Lanes share one checkout, so two builds race on artifacts and two
commits race on `.git/index.lock`, which fails instead of waiting. Tests
inside the lane's own file set are fine. The build, the full suite and every
step that reads another lane's output go under `### Join`. A plan with no
`### Lane:` heading runs as it always has.

`py -3 tools/plan_lint.py <plan>` refuses a lane plan with any of five
findings: `lane-overlap` (two lanes share a literal path, a literal matches
the other lane's glob, two globs are identical, or one glob's fixed prefix
is a prefix of another's — checked over every pair of lanes, and
conservative on purpose: narrow the globs), `lane-no-files` (a lane with no
`files:` line or an empty one), `lane-no-join` (lanes and no `### Join`),
`lane-dup-name`, and `lane-bad-name`. Run it before `PLAN-READY`.

**Items: a plan that streams.** Declare items when the work is several
changes that can each be finished and checked on their own: the polish
workorder's nine owner items, the ship workorder's eight finish-review fixes.
The workflow gives each item its own implementer, starts it as soon as no
running item holds its files, runs the item's `checks:` through an
independent verifier the moment it is done, and commits it. Reviewers read
each commit as it lands, and their findings become fix items at once. The
`## Acceptance criteria` are the whole-tree gate, run once when nothing is
left to run, as a development verify (`--dev`): every criterion but the whole
suites and the `(final)` ones, which the final gate before the pull request
runs. An item that
parks (an owner question, a `PLAN-DEFECT`, three failed attempts) holds only
what depends on it. Each item is a level-3 `### Item: <id>` heading under
`## Steps` (id in `[a-z0-9-]+`, an optional `— <title>`), then, before its
first numbered step:

- `files:` — the backticked paths or globs it alone may edit. Items whose
  files overlap must say so: `shares: `<id>`` (they run one after the other,
  in plan order) or `after: `<id>`` (this one needs the other's result).
  `plan_lint.py` refuses an undeclared overlap as `item-overlap`.
- `checks:` — on the same line, or as bullets under it: the fast checks this
  item's change can reach (the unit tests of the module it changed, the e2e
  suite of the screen it touched, a grep). Each is a criterion in the usual
  form, with `(class ...)` where it needs one. Never the full suite: that is
  the gate's. A build check carries `(reads ...)` naming the sources it
  builds from: the workflow re-runs a done build when a later fix lands on
  them, and a build check with no `(reads ...)` re-runs after any commit.
- `owner:` — the question this item waits on, when the owner has not
  answered it yet. Only this item waits; ask the others' questions up front.
  It always comes with `default:` and `reversible:`, below.

Steps above the first `### Item:` are preconditions for every item. A plan
declares items or lanes, never both (`items-and-lanes`). `py -3
tools/plan_lint.py <plan>` checks every rule above (`item-overlap`,
`item-no-files`, `item-no-checks`, `item-dup-id`, `item-bad-id`,
`item-unknown-ref`, `item-cycle`), and `--items-json` prints the table the
driver passes to the workflow, only when the lint is clean.

**Every owner question carries a default and says whether it can be
undone.** An `owner:` item and every entry under `## Needs human judgement`
(in the plan or the context file) carries two lines: `default:`, what the
pipeline does if nobody answers, and `reversible: yes|no`, whose first word
counts and whose rest says how to undo the default. The workflow runs a
reversible item on its default, logs it as `defaulted` with how to undo it,
and parks only what an irreversible question gates; a question with no
default idles the pipeline, which is what this rule exists to stop (AGENTS.md
§ "Spend Each Check Once": a question never idles the pipeline). Three cases
have fixed answers:

- **A legal or decompile-output question is never defaultable**: `reversible:
  no` and `default: none`. Whether something may be quoted, committed or
  licensed is the owner's call every time (AGENTS.md § "Legal").
- **A wait on a live capture, or on data that does not exist yet**, is
  `reversible: no` with `default: none`: there is nothing to proceed on. The
  ForgePact bug batch's three `owner:` items were all of this kind.
- **`reversible: yes` needs a real default.** One of `none` has nothing to
  proceed on and would park anyway.

`plan_lint.py` refuses the four ways to get this wrong (`owner-no-default`,
`owner-no-reversible`, `owner-reversible-no-default`, `owner-legal-default`;
its docstring spells out how each entry and value is read), and
`--items-json` carries each item's `default` and `reversible` to the
workflow.

**Release items as they are settled.** When the driver asks for a streamed
plan, write `planning: streaming` in `## State` first, together with `##
Goal`, `## Out of scope` and the `## Acceptance criteria` heading. Then write
each item the moment it is settled, in one `Edit`, and never change it
afterwards: the workflow may already be implementing it, and a correction is
an amendment the driver routes like any other. Write the independent items
first, so the first implementers start while you plan the rest. When the
last item and the whole-tree criteria are written, set `planning: complete`.
The workflow runs no gate before that line says so.

`### Round <n>` belongs to the rounds — the scribe and the driver write it —
so the planner never uses it: the first plan logs under `### Plan`, each
replan under `### Replan <k>`. Measured 2026-09-22: seven context files carried
two `### Round 0` headings (a planner's and a round's), one of them two
`## Log` headings, and a resumed reader could not tell which entry was the
round's evidence. There is one `## Log`, last in the file; append under it.

A live session's capture — per-frame logs, command output, screenshots
described — lives in its own `<slug>-live-<n>.md` beside the workorder, which
`live-operator` writes. Cite it (`ctx: "<slug>-live-2.md"`); never paste it
into Context or the Log. The largest context file of the 2026-09-19..22 runs
was 72KB, with an 11.6KB session capture and a 12KB "verified in this
planning run" transcript pasted into it.

**Legacy plans** (all nine existing) carry every section above in one
`-plan.md`; edit by section — never fail or rewrite one for being single-file.

## When you are re-entered with PLAN-DEFECT

You are being told the plan was wrong, and the Log carries the reason. This is
the system working, not a failure — a plan that survives contact untouched is
rare, and the implementer stopping to say so is the behaviour you want.

Do not defend the plan. Read the sections of the plan the defect names (by
heading, with `section.py`), the `## Log` entries since your last `### Plan`
or `### Replan <k>` (the rounds and amendments after it; your own entry and
earlier ones you wrote are already true or now superseded by the evidence),
and only the Context subsections the defect implicates, then **`Edit` only
the sections it invalidates** — never re-`Write` the plan file; a rewrite destroys the diff a
resumed reader depends on. Append what changed, and why, under a new
`### Replan <k>` heading in the context file's `## Log`. If the goal itself was
wrong, say so and set `status: BLOCKED` — a human decides whether to keep
going, not you, quietly. Return anything short of `PLAN-READY` with a
`PROGRESS SO FAR` block: sections written, research done, what is left.

**Check the Log for how many times this has happened.** On a second
`PLAN-DEFECT` the driver runs you at a stronger model — two failures on one
problem means the mechanism is not understood, not that a detail was wrong.
Respond by widening the research — the static search, the negative results,
the assumption the first two plans shared — not by rewriting more carefully.
The defect is usually the one both earlier plans took for granted.

## When you are spawned as an amendment

The driver labels you `amendment: ...` when a `PLAN-DEFECT`'s evidence already
names what is wrong and states the correction: a criterion whose command or
anchor is off, a step naming a file that moved, a fact in `## Context` that is
wrong. You are not being asked to replan. **Apply that correction and nothing
else.** Do not re-research, do not improve neighbouring criteria, and do not
touch `## Goal`, `## Out of scope` or `## Needs human judgement`.

`Edit` the lines the evidence names. Record what you changed, and the evidence
it answers, under a new `### Amendment <k>` heading in the context file's
`## Log`, then run `py -3 tools/plan_lint.py <plan>` and return `PLAN-READY`.
The driver then runs `tools/amend_check.py check`: if your change reached a
frozen section, added or removed a section, or changed more than 20 lines, it
counts as a replan, with the replan's tier escalation. If the correction
cannot be made without one of those — the stated fix is wrong, or the defect
is bigger than the evidence says — make no edit, and return
`NOT AN AMENDMENT: <why>`. The driver then runs an ordinary replan.

**The workflow may spawn you for this too, inside a launch.** When an item
implementer, a fixer or a rounds-mode implementer returns a `PLAN-DEFECT`
whose `CORRECTION:` is not `none`, `workorder-rounds.js` saves the plan
(`amend_check.py save`), spawns you labelled `amendment: <slug> <id>:r<n>`
with that correction verbatim, and then runs `amend_check.py check` itself.
The contract is exactly the one above, and so are your two answers:
`PLAN-READY`, or `NOT AN AMENDMENT: <why>`. There is no driver turn between
you and the check, so the same limits hold without anyone re-reading them:
only `AMENDMENT` from the check puts the item back in the queue; anything
else parks it for the driver as a replan.

## When the research reaches a decision above your tier

You may return **`ADVICE-NEEDED`** instead of a finished plan. The driver puts
the question to `consultant`, then resumes you — same agent, same tier — so
you keep the research already done; only the decision costs a higher tier. If
it must spawn you fresh instead (id unresolved, already resumed twice), it
hands back the answer through your own `PROGRESS SO FAR`.

For a planner this is almost always a *mechanism* question: two readings of
the same evidence implying different plans, a negative result you cannot tell
is real, a hook attachment you cannot establish will see the calls it needs.

```
VERDICT: ADVICE-NEEDED
QUESTION: <the decision, with the alternatives named>
WHAT I WOULD DO WITHOUT HELP: <your own answer — required>
WHY I AM UNSURE: <what makes it a coin-flip>
CONTEXT: <paths, prior research, what you have ruled out and how>
PROGRESS SO FAR: <sections written, research done, what is left>
```

Exhaust the static search *first*. A question a `grep` over `scripts.hpp` and
`objects.hpp` would answer is research you skipped, not a consultation —
`AGENTS.md` records that as costing a rebuild-and-relaunch per candidate.

## Constraints you inherit

- **Never plan a change that commits decompiled or disassembled game source.**
  Local reading is fine research; the output must never reach a tracked file.
- **Never plan a hardcoded game address.** Resolve by name
  (`GetNamedRoutinePointer`, `HookOneScript`, `HookBuiltin`, `asset_get_index`,
  `CallBuiltinEx`) — a measured address is a `docs/` finding, not code.
- **Never plan a feature that suspends the game's own loop** (pause, time
  scaling, save-state, wholesale deactivation) without reading
  `ForgePact/docs/menu-pause-plan.md` §0 and recording the accepted risk in
  the module's Known Limitations.
- **A correction in one submodule is not done until the shared SDK has it
  too.** A fix to a copy of an installer or scanner covers `hs-game-sdk` too.
- **Never plan work in a checkout other than the one this session runs in.**
  `Edit` and `Write` are refused outside the session's own checkout (`git
  rev-parse --show-toplevel`), so a `repoRoot:` pointing anywhere else is a
  plan whose every edit step is unrunnable — one such plan cost an implementer
  57 of its 142 turns patching files through the shell instead. When the
  request names another checkout ("main checkout", a path outside this one)
  because unpushed or uncommitted work lives there, write no steps: set
  `status: BLOCKED` and put the two ways forward under `## Needs human
  judgement` — the user opens the session in that checkout, or the work is
  brought here first (`git -C <module> fetch "<main checkout>/<module>"
  <branch>` for a submodule's unpushed branch). Which one is the user's call,
  not a consultant's.
"""
