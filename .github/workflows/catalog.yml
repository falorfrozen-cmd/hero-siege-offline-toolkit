# Regenerate catalog.json when a tool repository signals that something moved.
name: Catalog

on:
  # Two dispatch types rebuild the catalog:
  #
  #   release-published  A tool published a release. This is the event that
  #                      actually changes the catalog, since the catalog is
  #                      built from each tool's latest *release*. Sent by
  #                      .github/workflow-templates/notify-hub-release.example.yml.
  #
  #   submodule-updated  A commit landed on a tool's default branch. This is
  #                      the same event submodule-dispatch.yml uses to bump the
  #                      submodule pointer (sent by notify-hub.example.yml), so
  #                      one dispatch now has two consequences. A commit does
  #                      not change the catalog on its own, but it is the most
  #                      frequent signal that a tool repository is active, and a
  #                      rebuild that finds nothing new opens no pull request.
  repository_dispatch:
    types: [release-published, submodule-updated]

  # There is deliberately no `schedule:` here: this rebuilds on real events
  # rather than on a clock. The consequence worth knowing is that a release
  # published by hand, from a repository whose notifier is not installed or
  # whose HUB_DISPATCH_TOKEN has lapsed, is now picked up by nothing at all.
  # When that happens, rebuild from Actions > Catalog > Run workflow.
  workflow_dispatch:
    inputs:
      only:
        description: >-
          Space-separated tool ids to rebuild. Every other tool keeps the entry
          it already has. Leave empty to rebuild all.
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: catalog
  cancel-in-progress: false

jobs:
  regenerate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: read
      statuses: read
      # To start catalog-publish.yml after an automatic merge; see below.
      actions: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The payload of a repository_dispatch is attacker-influenced in exactly
      # the same way submodule-dispatch.yml treats it: whoever can fire the
      # event chooses these strings. Nothing here interpolates them into a
      # shell; the allowlist is so an unexpected sender shows up in the log
      # rather than silently causing a rebuild.
      # The two dispatch types name their sender in different fields:
      # `release-published` carries `repository` as `owner/name`, while
      # `submodule-updated` carries `submodule` as the bare path from
      # .gitmodules. Take whichever is present and check that against the same
      # list. EVENT comes through the environment for the same reason the
      # payload does -- nothing here reaches the shell as an expression.
      - name: Check the sender against the allowlist
        if: github.event_name == 'repository_dispatch'
        env:
          SENDER: ${{ github.event.client_payload.repository }}
          SUBMODULE: ${{ github.event.client_payload.submodule }}
          EVENT: ${{ github.event.action }}
        run: |
          allowed="ForgePact HSCraftSim HSSaveEditor HSSaveEditor-SteamDeck- \
                   HS-Offline-Launcher HS-Offline-Tracker HS-ValueEditor \
                   Hs-Offline-Loot-Forge hero-siege-item-editor hs-stat-forge"
          name="${SENDER##*/}"
          [ -n "$name" ] || name="$SUBMODULE"
          for candidate in $allowed; do
            if [ "$candidate" = "$name" ]; then
              echo "$EVENT notification from $name"
              exit 0
            fi
          done
          echo "::error::unrecognised sender '${SENDER:-$SUBMODULE}' for \
          '$EVENT'; not rebuilding"
          exit 1

      # The generator downloads every artifact to hash it. GITHUB_TOKEN raises
      # the API limit well past the ~30 requests a full build spends.
      - name: Rebuild the catalog
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through the environment rather than `${{ }}` inside the script: an
          # expression is substituted before the shell ever sees it, so an input
          # containing a backtick or `$(...)` would run as part of this step.
          ONLY: ${{ github.event.inputs.only }}
        run: |
          if [ -n "$ONLY" ]; then
            python tools/build_catalog.py --only $ONLY
          else
            python tools/build_catalog.py
          fi

      - name: Sign it
        env:
          HUB_MINISIGN_SECRET_KEY: ${{ secrets.HUB_MINISIGN_SECRET_KEY }}
        run: |
          if [ -z "$HUB_MINISIGN_SECRET_KEY" ]; then
            echo "::error::HUB_MINISIGN_SECRET_KEY is not set. The hub refuses an \
          unsigned catalog, so publishing one would ship a hub that cannot update."
            exit 1
          fi
          python tools/minisign.py sign catalog/catalog.json \
            --trusted-comment "catalog $(date -u +%Y-%m-%dT%H:%M:%SZ) ci:${GITHUB_RUN_ID}"
          python tools/minisign.py verify catalog/catalog.json \
            --public-key catalog/catalog-signing.pub

      - name: Check the tests still pass against the new catalog
        run: python -m unittest discover -s tests

      # Only decides whether to open a pull request. Publishing is
      # catalog-publish.yml's job, triggered by that pull request being merged.
      - name: Has anything actually changed?
        id: changed
        run: |
          # `generated` moves on every run, so a rebuild that found nothing
          # new still produces a diff. Comparing with that one line removed is
          # the whole question: anything else that moved is a real change.
          git show HEAD:catalog/catalog.json | grep -v '"generated"' > /tmp/before.json
          grep -v '"generated"' catalog/catalog.json > /tmp/after.json
          if diff -q /tmp/before.json /tmp/after.json >/dev/null; then
            echo "nothing but the timestamp moved"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            diff -u /tmp/before.json /tmp/after.json | head -60 || true
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A pull request, never a push. submodule-dispatch.yml already set that
      # rule for cross-repository events and there is no reason this one gets an
      # exception: an event anyone can fire should not move the default branch.
      - name: Open a pull request
        id: catalog_pr
        if: steps.changed.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          branch: catalog/regenerate
          base: main
          commit-message: |
            Regenerate the tool catalog

            Rebuilt by .github/workflows/catalog.yml. Every artifact was
            downloaded and hashed; a published checksum that disagreed with the
            bytes would have failed the build rather than reaching this diff.
          title: 'Regenerate the tool catalog'
          body: |
            One or more tools published a release, so `catalog/catalog.json` was
            rebuilt and re-signed.

            The run that opened this merges it automatically when it is still
            the exact commit that run signed, verified and tested, changes
            nothing but the catalog pair, and is clean. If you are reading this
            on an open PR, one of those did not hold — the job log says which.

            What to check before merging by hand:

            - the version and `sha256` moved for the tools you expected, and no
              others
            - `strip_prefix` and `launch.exe` still look right for anything whose
              packaging changed — the generator verifies the entry point is in
              the archive, so a wrong one fails the build, but a *moved* one
              passes and is worth a look
            - `sha256_source` still reads `published+verified` where it used to

            Merging this publishes it: `catalog-publish.yml` uploads
            `catalog.json` and its signature to the `catalog` release tag, which
            is what installed hubs fetch.
          labels: catalog
          delete-branch: true

      # A tool release marked latest should reach installed hubs without a
      # person in the loop, the same way submodule-dispatch.yml merges pointer
      # PRs. Everything this run could get wrong has already failed the job
      # above (signature, tests); the script only confirms the PR is still that
      # exact commit and nothing else.
      - name: Validate and merge only this catalog PR
        id: merge
        if: steps.catalog_pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.catalog_pr.outputs.pull-request-number }}
          HEAD_SHA: ${{ steps.catalog_pr.outputs.pull-request-head-sha }}
        run: |
          python tools/merge_catalog_pr.py \
            --pull-request "$PR_NUMBER" --head "$HEAD_SHA" \
            --merge --output "$GITHUB_OUTPUT"

      # A push made with GITHUB_TOKEN starts no workflows, so the merge above
      # does not trigger catalog-publish.yml's `push` — without this step the
      # catalog would merge and never reach the tag installed hubs fetch.
      # workflow_dispatch is one of the events GITHUB_TOKEN is allowed to fire.
      - name: Publish the merged catalog
        if: steps.merge.outputs.merged == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run catalog-publish.yml --ref main
