name: AI Code Review

# Opt-in review. Nothing here runs on its own: a person either adds the
# `ai-review` label to a pull request or comments `@claude review` on it.
#
# There is deliberately no `on: pull_request` trigger. `submodule-dispatch.yml`
# and `catalog.yml` both open pull requests automatically (`auto/bump-*`,
# catalog regeneration), and a pointer bump is a one-line SHA change with
# nothing to review. Reviewing every opened PR would spend a review on each of
# those, so the trigger is the request, not the PR.
#
# Requesting a review:
#   - Add the `ai-review` label in the PR sidebar, or
#   - comment `@claude review` on the PR.
#
# Anything written after the trigger phrase is passed to the reviewer as the
# requester's instructions and takes precedence over the default scope:
#   @claude review
#   @claude review only hub/src-tauri
#   @claude review skip the catalog JSON, just the workflow and the tests
# The label carries no instructions, so it always requests a full review.
#
# Either one may be used again later for a fresh review after pushing changes;
# the label alone does not re-run on later pushes.
#
# Two gates beyond the triggers, both enforced by the action itself:
#   - the requesting user must have write access to this repository, and
#   - a bot actor is rejected, so labelling from automation cannot start a run.
#
# Two things must be in place or the job fails before it reviews anything:
#   - the Claude GitHub App (https://github.com/apps/claude) installed on this
#     repository. Without it the token exchange returns 401, "Claude Code is
#     not installed on this repository", and nothing runs.
#   - the `CLAUDE_CODE_OAUTH_TOKEN` secret, from `claude setup-token`.
#
# On a fork pull request GitHub withholds secrets, so the run cannot
# authenticate and the review does not happen. Branches pushed to this
# repository are unaffected, which is how work lands here.

on:
  pull_request:
    types: [labeled]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: read
  id-token: write

jobs:
  review:
    if: >-
      github.repository == 'falorfrozen-cmd/hero-siege-offline-toolkit'
      && (
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
        || (
          github.event_name == 'issue_comment'
          && github.event.issue.pull_request != null
          && startsWith(github.event.comment.body, '@claude review')
        )
      )
    # Concurrency lives on the job, and its group is only shared when the
    # event is a real request. Every issue comment and every label starts a
    # run of this workflow, including a plain "thanks" or an unrelated label.
    # At workflow level those runs joined `ai-review-<PR>` before the `if`
    # above was ever looked at, so with cancel-in-progress they cancelled a
    # review that was already running. An unrequested event now gets a group
    # unique to its own run and can cancel nothing, whether or not GitHub
    # evaluates the `if` before the group. The predicate is written out twice
    # because neither `concurrency` nor `if` can read a value the other
    # computes; tests/test_ai_review_workflow.py fails if the two copies drift.
    concurrency:
      group: >-
        ${{
        (
        github.repository == 'falorfrozen-cmd/hero-siege-offline-toolkit'
        && (
        (github.event_name == 'pull_request' && github.event.label.name == 'ai-review')
        || (
        github.event_name == 'issue_comment'
        && github.event.issue.pull_request != null
        && startsWith(github.event.comment.body, '@claude review')
        )
        )
        )
        && format('ai-review-{0}', github.event.pull_request.number || github.event.issue.number)
        || format('ai-review-unrequested-{0}', github.run_id)
        }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    # A whole review of a large pull request takes longer than 30 minutes:
    # ForgePact #105 (67 files, 5,003 added lines, most of it panel CSS, plus
    # the design tooling) was cancelled at 30 with nothing posted, while a
    # scoped `@claude review` of one of its commits finished in 8. The review
    # step below has a shorter limit of its own, so a review that runs out of
    # time fails that step and the job still reaches the result upload,
    # rather than the whole job being cancelled.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          # The pull request's own head, with full history and every branch,
          # so the reviewer can diff a subset of paths against the base with
          # git instead of pulling the whole pull request through `gh pr diff`.
          # The code is only read, never built or run.
          ref: refs/pull/${{ github.event.pull_request.number || github.event.issue.number }}/head
          fetch-depth: 0

      # The check after the review counts only comments created after this.
      - name: Note when the review started
        id: started
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # Turns the request into the text that follows the trigger phrase. The
      # comment body reaches the shell only through an environment variable,
      # never through `${{ }}` in the script, so it cannot inject commands.
      - name: Read the request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          # Empty for the label trigger.
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          # `@claude review` is 14 characters long.
          instructions=""
          if [ -n "$COMMENT_BODY" ]; then
            instructions="${COMMENT_BODY:14}"
            # Trim surrounding whitespace, including the \r of CRLF comments.
            instructions="${instructions#"${instructions%%[![:space:]]*}"}"
            instructions="${instructions%"${instructions##*[![:space:]]}"}"
          fi
          base=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json baseRefName --jq .baseRefName)

          # Changed files no reviewer needs to read: binaries (`--numstat`
          # prints `-` for them), licence texts and lockfiles. ForgePact #105
          # carried 27 images and fonts and two copies of a font licence.
          mapfile -t skip < <(
            {
              git diff --numstat --no-renames "origin/$base...HEAD" | awk -F'\t' '$1 == "-" { print $3 }'
              git diff --name-only --no-renames --diff-filter=d "origin/$base...HEAD" -- \
                '*LICENSE*' '*LICENCE*' '*COPYING*' '*OFL*.txt' '*/licenses/*' '*.lock' '*package-lock.json'
            } | sort -u
          )

          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "notes<<$delim"
            echo
            echo "The pull request head is checked out in the working directory with full history."
            echo "\`git diff origin/$base...HEAD -- <pathspec>\` shows the pull request's changes for chosen paths only,"
            echo "and \`git diff --stat origin/$base...HEAD\` lists every changed file with its size."
            echo "Pathspecs can exclude too, for example \`-- . ':(exclude)*.json'\`."
            echo "If \`gh pr diff\` fails because the diff is too large, use git instead."
            # hub #365 and ForgePact #141 went green after a 10-20 s pass the
            # model made itself, without one of the command's agents.
            echo
            echo "Run the review through the code-review command's agents, step by step as it describes: the"
            echo "eligibility, CLAUDE.md-list and summary agents, the four review agents in parallel, then one"
            echo "validation agent per issue they found. Do not replace them with a review of your own, however"
            echo "small the change looks; only the eligibility agent decides that a pull request needs no review."
            echo "A later step of this job counts the agents in this run's transcript and fails the job when"
            echo "they are missing."
            echo
            echo "Read files with Read, Grep and Glob, and the change with \`git diff\` or \`git show\`. Of the"
            echo "shell's text tools only \`cat\`, \`head\`, \`tail\`, \`wc\` and \`sed -n\` are allowed; a compound"
            echo "command that also uses anything else is refused as a whole, and costs a turn."
            # ForgePact #105's scoped review was refused four times trying to
            # write its comment to a file first, and posted on the fifth try.
            echo
            echo "Post each comment in one command: \`gh pr comment <number> --body \"\$(cat <<'EOF' ... EOF)\"\`."
            echo "Do not write it to a file first: this run cannot create files (Write and shell redirection"
            echo "are denied), and every refused attempt costs a turn."
            if [ "${#skip[@]}" -gt 0 ]; then
              echo
              echo "These changed files are binary, licence text or lockfiles. Do not read or report on them,"
              echo "and leave them out of \`git diff\` with \`':(exclude)<path>'\`:"
              printf -- '- %s\n' "${skip[@]}"
            fi
            if [ -n "$instructions" ]; then
              echo
              echo "The person who requested this review gave these instructions. They take precedence"
              echo "over the default scope of the review and over any step that would read more than they allow:"
              echo
              echo "<requester-instructions>"
              printf '%s\n' "$instructions"
              echo "</requester-instructions>"
              echo
              echo "Pass these instructions verbatim to every agent you launch. When they narrow what to read,"
              echo "do not run \`gh pr diff\`, whose output is the whole pull request: list the changed files with"
              echo "\`git diff --stat\` and read only the permitted ones with a git pathspec. A review was explicitly"
              echo "requested, so an earlier review on this pull request is not a reason to stop. State the scope"
              echo "you reviewed in the final comment."
            fi
            echo "$delim"
          } >> "$GITHUB_OUTPUT"

          if [ -n "$instructions" ]; then
            echo "Requester instructions:"
            printf '%s\n' "$instructions"
          else
            echo "No requester instructions; full review."
          fi

      - uses: anthropics/claude-code-action@v1
        timeout-minutes: 55
        env:
          # Makes every Agent call run in the foreground. The code-review
          # command runs its whole review through subagents, and agents run in
          # the background by default. A CI run ends when the model ends its
          # turn, so on hub #59 the model started its eligibility check in the
          # background, ended its turn "waiting for the completion
          # notification", and the session ended there: nothing was reviewed,
          # nothing was posted, and the job went green.
          CLAUDE_CODE_DISABLE_BACKGROUND_TASKS: "1"
        with:
          # A subscription OAuth token from `claude setup-token`, not an API
          # key. See docs/hub/design.md, "Repository secrets".
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: |
            /code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number || github.event.issue.number }}
            ${{ steps.request.outputs.notes }}
          # `--allowedTools` is the whole allow-list for the run, not an addition
          # to the skill's own. It must name every tool the code-review command
          # declares in its `allowed-tools` frontmatter. The first version named
          # only the inline-comment tool: `gh pr view` and `gh pr diff` were
          # denied, so the review could not read the pull request, and
          # `gh pr comment` was denied, so its "No issues found" summary could
          # not post either. The job still went green, with
          # `permission_denials_count: 5` and nothing on the PR (hub #56). The
          # inline-comment tool must stay listed: the action only starts the MCP
          # server that posts inline comments when this argument names it.
          # `Skill` is listed because the prompt is a plugin command: without
          # it that first call is a permission denial (hub #59). The read-only
          # git commands and Read/Grep/Glob let a scoped request read only the
          # part of the change it names. The read-only text tools (`cat`,
          # `head`, `tail`, `wc`, `sed -n`) are what a review reaches for
          # anyway: ForgePact #141 was denied a compound `head`/`cat` command
          # and cut its review short. They read no more than `Read` already
          # can, and shell redirection stays refused.
          #
          # `--model` pins the model that follows the command. The command
          # takes no effort or level argument, and on its default model it
          # replaced the whole multi-agent review with a single pass of its
          # own on hub #365 and ForgePact #141. The subagents' models are the
          # command's own choice (haiku, sonnet and opus by step).
          claude_args: '--model claude-opus-5-5 --allowedTools "Skill,Read,Grep,Glob,mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*),Bash(gh issue view:*),Bash(gh issue list:*),Bash(gh search:*),Bash(git diff:*),Bash(git log:*),Bash(git blame:*),Bash(git show:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(sed -n:*)"'

      # The action succeeds whenever the model exits cleanly, which includes
      # a run that reviewed nothing -- hub #56 (tools denied) and hub #59 (the
      # session ended while a background agent was still working) both went
      # green with nothing on the PR. So the job checks the outcome itself:
      # if no comment or inline comment appeared on the PR after the review
      # started, it fails and prints the review's last message. A run whose
      # eligibility check deliberately stopped (the PR is closed or a draft,
      # or Claude has already commented) also goes red here, with that reason
      # printed: a review was requested and none was posted.
      - name: Fail if the review posted nothing
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          SINCE: ${{ steps.started.outputs.at }}
          RESULT_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          count() {
            gh api --paginate "repos/$GITHUB_REPOSITORY/$1?since=$SINCE&per_page=100" \
              --jq "[.[] | select(.created_at >= \"$SINCE\")] | length" \
              | awk '{ total += $1 } END { print total + 0 }'
          }
          comments=$(count "issues/$PR/comments")
          inline=$(count "pulls/$PR/comments")
          echo "Posted since $SINCE: $comments comment(s), $inline inline comment(s)."
          if [ "$comments" -eq 0 ] && [ "$inline" -eq 0 ]; then
            echo "::error::The review posted nothing on #$PR. Its last message:"
            jq -r '[.[] | select(.type == "result")] | last | .result // "(no result recorded)"' "$RESULT_FILE" || true
            exit 1
          fi

      # A posted comment is not a review. On hub #365 (4 turns, 10.6 s) and
      # ForgePact #141 (7 turns, 20.3 s) the model read part of the diff
      # itself, never launched one of the code-review command's agents, posted
      # "No issues found", and said in its last message that it had skipped
      # the review. The check above saw a comment and passed. So this one
      # reads the transcript: steps 1 to 4 of the command launch seven agents
      # (eligibility, CLAUDE.md list, summary and four reviewers), and that
      # does not finish in seconds. The job fails if the run launched fewer,
      # finished under the floor, or admitted skipping the review, and prints
      # each agent it did launch with the last message, so an eligibility
      # stop that still posted a comment reads as one and not as a skip. It
      # is red all the same, like the check above: a review was requested.
      # tests/test_ai_review_workflow.py checks ADMITTED against the recorded
      # last messages of those runs, and against a real review's.
      - name: Fail if the review skipped the command's agents
        env:
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          RESULT_FILE: ${{ runner.temp }}/claude-execution-output.json
          MIN_AGENTS: "7"
          MIN_SECONDS: "60"
          ADMITTED: "(did not|didn't) (run|launch|use|follow)[^.]*(multi-agent|agents|recipe|command)|not the (four|4) |single pass|(reviewed|read) the (code )?diff (myself|in a single pass)"
        run: |
          agents=$(jq '[.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use" and (.name == "Agent" or .name == "Task"))] | length' "$RESULT_FILE")
          result=$(jq -c '[.[] | select(.type == "result")] | last // {}' "$RESULT_FILE")
          turns=$(jq -r '.num_turns // 0' <<< "$result")
          seconds=$(jq -r '(.duration_ms // 0) / 1000 | floor' <<< "$result")
          message=$(jq -r '.result // "(no result recorded)"' <<< "$result")
          echo "Agents launched: $agents. Turns: $turns. Duration: $seconds s."
          jq -r '.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use" and (.name == "Agent" or .name == "Task")) | "- " + (.input.description // "(no description)")' "$RESULT_FILE"

          reasons=()
          if [ "$agents" -eq 0 ]; then
            reasons+=("it launched no agent at all")
          elif [ "$agents" -lt "$MIN_AGENTS" ]; then
            reasons+=("it launched $agents agent(s), where steps 1 to 4 launch $MIN_AGENTS (an eligibility stop launches one)")
          fi
          if [ "$seconds" -lt "$MIN_SECONDS" ]; then
            reasons+=("it finished in $seconds s")
          fi
          admitted=$(grep -oiE -m1 "$ADMITTED" <<< "$message" | head -n1 || true)
          if [ -n "$admitted" ]; then
            reasons+=("its last message says so: \"$admitted\"")
          fi

          if [ "${#reasons[@]}" -gt 0 ]; then
            printf -v joined '%s; ' "${reasons[@]}"
            echo "::error::The review did not run the code-review command's agents on #$PR: ${joined%; }."
            echo "Its last message:"
            printf '%s\n' "$message"
            exit 1
          fi
          echo "The review ran through the command's agents."

      # The action prints a trimmed result to the log: per-model token counts
      # are dropped, and the full result file stays on the runner, which is
      # gone once the job ends. Keeping it is the only way to see what a review
      # used or what it was denied. It also holds the review transcript, which
      # is visible to anyone with read access to this repository.
      - name: Keep the run's full result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: claude-execution-output
          path: ${{ runner.temp }}/claude-execution-output.json
          if-no-files-found: warn
          retention-days: 14

      # The job's summary page says what the review did and where the whole
      # transcript is, so nobody has to read the step log or guess at the
      # artifact: which agents ran, how long it took, which tools were denied
      # and the review's last message. Runs whatever the steps above decided.
      - name: Summarize the review run
        if: always()
        env:
          RESULT_FILE: ${{ runner.temp }}/claude-execution-output.json
        run: |
          {
            echo "## AI review run"
            echo
            if [ ! -f "$RESULT_FILE" ]; then
              echo "The review left no result file, so there is no transcript to show."
              exit 0
            fi
            jq -r '
              ([.[] | select(.type == "result")] | last // {}) as $r
              | [.[] | select(.type == "assistant") | .message.content[]? | select(.type == "tool_use")] as $calls
              | [$calls[] | select(.name == "Agent" or .name == "Task")] as $agents
              | "| | |", "|---|---|",
                "| Model | \([.[] | select(.type == "system" and .subtype == "init") | .model] | first // "?") |",
                "| Agents launched | \($agents | length) |",
                "| Turns | \($r.num_turns // "?") |",
                "| Duration | \((($r.duration_ms // 0) / 1000 | floor)) s |",
                "| Cost | $\($r.total_cost_usd // 0) |",
                "| Denied tool calls | \($r.permission_denials // [] | length) |",
                "",
                (if ($agents | length) > 0 then "Agents:", ($agents[] | "- \(.input.description // "(no description)")"), "" else empty end),
                (if ($r.permission_denials // [] | length) > 0 then "Denied:", ($r.permission_denials[] | "- `\(.tool_name)`: `\(.tool_input.command // (.tool_input | tostring) | .[0:200])`"), "" else empty end),
                "### Last message", "", ($r.result // "(no result recorded)")
            ' "$RESULT_FILE"
            echo
            echo "The full transcript, with every tool call and per-model token counts, is this run's"
            echo "\`claude-execution-output\` artifact (Summary page, Artifacts)."
          } >> "$GITHUB_STEP_SUMMARY"
