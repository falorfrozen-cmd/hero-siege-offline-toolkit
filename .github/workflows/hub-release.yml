# Build, sign and publish the Toolkit Hub, plus the latest.json its updater reads.
#
# Normally started by `hub-tag.yml` (Actions > Hub tag), which checks the tag,
# moves the version to match and pushes it -- and dispatches this against the
# tag it just made, because every guard below is gated on a `refs/tags/hub-v`
# ref. A hand-pushed `hub-v*` tag runs it too. What it leaves behind is a draft
# in both cases.
name: Hub release

on:
  push:
    tags:
      - 'hub-v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and test without publishing a release'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

concurrency:
  group: hub-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Everything that can fail for a reason unrelated to packaging, failing first
  # and on a cheap runner.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Catalog generator and signer tests
        run: python -m unittest discover -s tests

      # The hub embeds catalog.json and verifies it against the embedded public
      # key at startup. A release built from a catalog and signature that
      # disagree would install and then refuse to show a library, so it is
      # checked here rather than discovered by a player.
      - name: The committed catalog verifies against the committed key
        run: |
          python tools/minisign.py verify catalog/catalog.json \
            --public-key catalog/catalog-signing.pub

      # The version lives in six places across five files. This used to compare
      # the tag against two of them, in the build job, and the four it skipped
      # included `Cargo.toml` -- which is what `CARGO_PKG_VERSION` reports, so
      # it is the version About shows and the version every log line carries. A
      # hub whose Cargo.toml and tauri.conf.json disagree logs one number and
      # compares against latest.json with another, which is two wrong answers
      # for whoever is trying to work out what is installed.
      #
      # `cut_release.py --check` is the same list the bumper writes from, so
      # the checker and the setter cannot drift apart.
      - name: The tag and all six version fields agree
        if: startsWith(github.ref, 'refs/tags/hub-v')
        run: python tools/cut_release.py --check --expect "${GITHUB_REF#refs/tags/hub-v}"

  build:
    needs: check
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hub/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: hub/src-tauri

      # Whichever repository is publishing this hub is the one it should trust.
      #
      # Four things need to agree: the catalog URL, its signature URL, the
      # updater endpoint and the documentation links. They are all derived from
      # one value -- `HUB_REPO` in Rust, and the updater endpoint here, because
      # tauri.conf.json cannot read an environment variable. Setting both from
      # `github.repository` means a fork's release checks the fork and the
      # canonical release checks the canonical repository, with no source edit
      # and no way for the two halves to disagree.
      - name: Point this build at the repository publishing it
        shell: bash
        env:
          REPO: ${{ github.repository }}
        run: |
          echo "HUB_REPO=$REPO" >> "$GITHUB_ENV"
          node -e '
            const fs = require("fs");
            const path = "hub/src-tauri/tauri.conf.json";
            const conf = JSON.parse(fs.readFileSync(path, "utf8"));
            const endpoint =
              "https://github.com/" + process.env.REPO +
              "/releases/latest/download/latest.json";
            conf.plugins.updater.endpoints = [endpoint];
            fs.writeFileSync(path, JSON.stringify(conf, null, 2));
            console.log("updater endpoint ->", endpoint);
          '

      - name: Install frontend dependencies
        working-directory: hub
        run: npm ci

      - name: Rust tests
        working-directory: hub
        run: npm test

      - name: Build the frontend
        working-directory: hub
        run: npm run build

      # The version check that used to live here now runs in `check`, against
      # all six fields instead of two -- earlier, on a cheap runner, and before
      # twelve minutes of Windows build time are spent on a tree whose version
      # numbers disagree.

      # tauri-action looks for a *draft* release with this tag and, finding
      # none, creates one. A release for the tag that is already published is
      # invisible to that search -- so the tag ends up with two release objects,
      # the installer and latest.json go to the new draft, and
      # `releases/latest/download/latest.json` resolves to whichever one GitHub
      # calls latest. On hub-v0.1.1 that was the empty one, so every installed
      # hub asked for its update and got a 404 with nothing to show for it.
      #
      # Stop rather than add a second release to a tag that already has one.
      - name: This tag has no release yet
        if: startsWith(github.ref, 'refs/tags/hub-v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # Not `--paginate`: with `--jq` that applies the filter per page and
          # prints one count per page, so the comparison below would read
          # "0\n0" and fail a clean tag. Releases come back newest first, and a
          # stray one for the tag being built now is necessarily recent.
          existing=$(gh api "repos/$REPO/releases?per_page=100" \
            --jq "[.[] | select(.tag_name == \"$TAG\")] | length")
          echo "releases already on $TAG: $existing"
          if [ "$existing" != "0" ]; then
            echo "::error::$TAG already has $existing release(s). Delete them before re-running, or this build will add another and the updater endpoint will resolve to the wrong one."
            exit 1
          fi

      # Build only, and deliberately with no release inputs at all.
      #
      # This used to be one step with `--no-bundle` appended for a dry run,
      # which could not work: `tauri-action` fails with `No artifacts were
      # found.` whenever a `tagName` is supplied and nothing was bundled, and
      # `--no-bundle` guarantees nothing is. So the dry run -- the thing whose
      # whole job is to prove a release will build -- was the one path that
      # could never finish. Bundling stays on here so what is exercised is what
      # a real release does; nothing is uploaded because nothing is configured
      # to be.
      - name: Build (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          # Signing still happens, so a key that cannot sign fails the dry run
          # rather than the release.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: hub

      - name: Build, sign and publish
        if: github.event.inputs.dry_run != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The updater will not accept an unsigned bundle: tauri.conf.json
          # carries the matching public key. Without this secret the build
          # produces an installer whose updates can never be verified.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: hub
          tagName: hub-v__VERSION__
          releaseName: 'Hero Siege Toolkit v__VERSION__'
          releaseBody: |
            The hub that installs, launches and updates the ten tools.

            Windows SmartScreen will warn about this download: there is no
            code-signing certificate for this project, and there is none for any
            of the ten tools either. What the hub offers instead is a SHA-256 for
            every artifact it installs, pinned in a catalog signed with a key
            built into the application.

            Installing the hub changes nothing about tools you already have, and
            uninstalling it never touches a tool's settings, saves or backups.
          releaseDraft: true
          prerelease: false
          # latest.json is what the updater endpoint in tauri.conf.json points
          # at. Without it the hub can be installed but never updates itself.
          includeUpdaterJson: true

      # `releaseDraft: true` is deliberate -- nothing ships without someone
      # looking at it first -- but it has a consequence that is easy to forget
      # and impossible to see from the hub: a draft's assets are not served, so
      # `releases/latest/download/latest.json` stays a 404 and no installed hub
      # can find the release. It is not published until a human publishes it.
      - name: Say that the release is still a draft
        if: startsWith(github.ref, 'refs/tags/hub-v')
        shell: bash
        env:
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo "### $TAG is built, and is a draft"
            echo
            echo "Until it is published, \`latest.json\` is not served and every"
            echo "installed hub's update check gets a 404:"
            echo
            echo "    https://github.com/$REPO/releases/latest/download/latest.json"
            echo
            echo "Publish it at https://github.com/$REPO/releases"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep the installer as an artifact on a dry run
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: hub-dry-run
          path: |
            hub/src-tauri/target/release/bundle/**/*
          if-no-files-found: ignore
          retention-days: 7
