kind = "zip"

[tool.requires]
admin = true
game_closed = false
game_running = true
windows_only = true

[tool.launch]
exe = "HSValueScanner.exe"
args = []
elevate = true
ports = []

# No source_launch: this repository contains a built .exe and nothing else.

