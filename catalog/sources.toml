[tool.launch]
exe = "HeroSiegeSaveEditor.exe"
args = []
elevate = false
ports = []

[tool.source_launch]
cmd = "py"
args = ["-3", "hs_save_editor.py"]

# ---------------------------------------------------------------------------

[[tool]]
id = "hssaveeditor-steamdeck"
name = "HS Steam Deck Save Editor"
summary = "Browser-based save editor for Steam Deck and handheld players."
repo = "falorfrozen-cmd/HSSaveEditor-SteamDeck-"
submodule = "HSSaveEditor-SteamDeck-"
license = "NOASSERTION"
guide = "docs/submodules/HSSaveEditor-SteamDeck-/instructions.md"
asset_pattern = '^HSSaveEditor-SteamDeck-Web-v[0-9][^/]*\.zip$'
kind = "html"

[tool.requires]
admin = false
game_closed = true
game_running = false
windows_only = false

# kind = "html": the hub opens this in the default browser instead of spawning a
# process, so there is no PID to track and no Running state.
[tool.launch]
exe = "HSSaveEditor.html"
args = []
elevate = false
ports = []

# ---------------------------------------------------------------------------

[[tool]]
id = "hs-value-editor"
name = "HS Value Scanner"
summary = "Memory value scanner and offline runtime value editor."
repo = "falorfrozen-cmd/HS-ValueEditor"
submodule = "HS-ValueEditor"
license = "NOASSERTION"
guide = "docs/submodules/HS-ValueEditor/instructions.md"
# Tag v1.0.2 ships an asset still named v1.0.1. The pattern deliberately does not
