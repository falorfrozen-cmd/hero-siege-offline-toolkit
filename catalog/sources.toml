# No source_launch: binary-only repository.

# ---------------------------------------------------------------------------

[[tool]]
id = "hs-stat-forge"
name = "HS Offline Stat Forge"
summary = "Runtime character stat tuner and monster density modifier."
repo = "falorfrozen-cmd/hs-stat-forge"
submodule = "hs-stat-forge"
license = "NOASSERTION"
guide = "docs/submodules/hs-stat-forge/instructions.md"
asset_pattern = '^HS-Offline-Stat-Forge-v[0-9][^/]*\.zip$'
kind = "zip"

[tool.requires]
admin = true
game_closed = false
game_running = true
windows_only = true

# HSStatForge.spec sets uac_admin=True, so the frozen exe asks for elevation on
# its own; declaring it here stops the hub spawning it non-elevated and having
# Windows fail the CreateProcess with ERROR_ELEVATION_REQUIRED.
[tool.launch]
exe = "HSStatForge.exe"
args = []
elevate = true
ports = []

[tool.source_launch]
cmd = "py"
args = ["-3", "hs_statforge.py"]

# ---------------------------------------------------------------------------

[[tool]]
id = "hero-siege-codex"
name = "Hero Siege Codex"
summary = "Explore items, classes, creatures, and the world."
repo = "falorfrozen-cmd/hero-siege-codex"
license = "NOASSERTION"
guide = "docs/tools/hero-siege-codex.md"
# Toolkit owns this portable tree; the standalone setup is a separate download.
asset_pattern = '^HeroSiegeItemCodex-[0-9]+\.[0-9]+\.[0-9]+-Windows-x64-Portable\.zip$'
kind = "zip"

[tool.requires]
admin = false
game_closed = false
game_running = false
windows_only = true

[tool.launch]
exe = "hero-siege-item-codex.exe"
args = []
elevate = false
ports = []

# Release-only integration: no submodule, source_launch or HTTP health endpoint.
